[project]
name = "pi-tui"
version = "0.1.0"
description = "Terminal User Interface library with differential rendering — Python port of @earendil-works/pi-tui"
requires-python = ">=3.11"
dependencies = [
    "wcwidth>=0.2.13",
    "mistune>=3.0.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "src"
disable_error_code = [
    "unused-ignore",
]

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = [
    "var-annotated",
    "unused-ignore",
    "comparison-overlap",
    "union-attr",
    "operator",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
